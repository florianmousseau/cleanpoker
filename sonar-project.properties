sonar.projectKey=florianmousseau_cleanpoker
sonar.organization=florianmousseau

sonar.projectName=CleanPoker
sonar.projectVersion=1.0

sonar.sources=backend,frontend/src
sonar.exclusions=**/node_modules/**,**/.svelte-kit/**,**/build/**,**/dist/**
sonar.cpd.exclusions=frontend/src/lib/i18n.ts

sonar.go.coverage.reportPaths=backend/coverage.out
sonar.coverage.exclusions=frontend/**,backend/**

sonar.javascript.tsconfigPaths=frontend/tsconfig.sonar.json

# app.html is a SvelteKit template, not a page: the title is injected per route
# at %sveltekit.head%. A static HTML analyser cannot see that. Putting a title
# back would sit above the injected block and win over the real one, which is
# exactly the bug this exclusion follows (every URL shipped two titles and
# search engines kept a bare "CleanPoker"). Every route sets its own title,
# including /[id] and +error.svelte, and a check enforces it in CI.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=Web:PageWithoutTitleCheck
sonar.issue.ignore.multicriteria.e1.resourceKey=frontend/src/app.html

sonar.qualitygate.wait=true
