app = "cleanpoker-backend"
primary_region = "cdg"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 500
    soft_limit = 400

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

# Pas de `[mounts]`, et c'est une panne de production qui l'a tranche.
#
# Le 2026-08-23, deux deploiements Fly se sont suivis a vingt secondes : le
# second n'a pas pu replacer la machine et a rendu, huit fois de suite,
# `insufficient resources to create new machine with existing volume
# 'vol_r68mo93lpqwoe0j4'`. Un volume EPINGLE la machine sur l'hote qui le porte ;
# quand cet hote n'a plus de place, l'application ne redemarre nulle part.
#
# Or aucun code n'ecrit dans `/data` : les salons et les compteurs vivent en
# memoire (`internal/store/store.go`) et repartent de zero au redemarrage. Le
# montage ne portait donc aucune donnee, seulement la contrainte de placement.
# Le volume lui-meme n'est pas supprime, il n'est plus monte.
