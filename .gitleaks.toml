# The two strings in this repo that look like secrets and are not.
#
# Both are page-counter site tokens, public by construction: they were served in
# the HTML of every page to every reader, which is the only way that counter
# could work. They name a site and grant nothing. gitleaks sees thirty-two hex
# characters next to the word "token" and recognises a generic API key, which is
# the right reflex on the wrong string.
#
# NEITHER IS SERVED ANY MORE - the measurement script left the whole portfolio
# on 2026-08-24 - and they still have to stay here: the scan reads the whole
# HISTORY, and a token dropped from this file is still written in the commits
# that carried it. Removing it turns a repository red with nothing new to hide.
# Each line carries its date and its reason, otherwise the list becomes a
# dumping ground.
#
# Allowed by exact VALUE, not by shape and not by path: the day thirty-two other
# hex characters appear anywhere in this repo, the scan goes red anyway.
# `frontend/scripts/mesure.mjs` refuses a line marked as served, because a token
# declared live is a beacon one tag away from coming back.
#
# `[allowlist]` and not `[[allowlists]]`: recent versions read the array form
# and the 8.24.3 that the gitleaks action installs IGNORES IT SILENTLY - same
# config, green locally, red in CI, and nothing in the output naming the
# skipped section. Measured on quivad on 2026-08-06. The singular form works in
# both, so every repo in the portfolio uses it.

[extend]
useDefault = true

[allowlist]
description = "Retired page-counter tokens, still written in the history of this repo"
regexes = [
  # Retired on 2026-08-24: the measurement script left every page of the
  # portfolio, so no page serves a token any more.
  '''d19c937236c74c41948f5d9977cada6d''',
  # Retired on 2026-08-13: it was the counter's `site_tag` and not its
  # `site_token`, so the site never counted a thing.
  '''403b694eecc348d28a4e889e6421623f''',
]
