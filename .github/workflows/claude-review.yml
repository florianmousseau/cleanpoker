name: claude-review

# Automatic AI review of every PR, focused on the failure modes AI-generated
# code drifts into and that linters cannot see. Skips cleanly when no
# CLAUDE_CODE_OAUTH_TOKEN secret is configured. NOTE: on the PR that first
# ADDS this file, the action skips with a "workflow validation" warning
# (anti-injection guard); it starts working once merged to the default branch.
#
# SECURITY INVARIANTS - do not relax these without reading why they exist.
# This workflow feeds attacker-controllable text (PR diff, title, body,
# comments) to an agent that holds a token, so three things are load-bearing:
#   1. The trigger stays `pull_request`, NEVER `pull_request_target`. On a PR
#      from a fork, `pull_request` withholds secrets, so CLAUDE_CODE_OAUTH_TOKEN
#      is empty and the review disables itself instead of running with a
#      writable token against untrusted code.
#   2. The `prompt:` below stays STATIC. Never interpolate a field the PR author
#      controls (`github.event.pull_request.title`, `.body`, a comment body)
#      into it. That exact pattern is how the "Comment and Control" attack class
#      exfiltrated CI secrets from agent actions in 2026.
#   3. `permissions` stays minimal. Widen it only with a stated reason.
#   4. The action is pinned to a COMMIT, not to `@v1`. A tag is mutable: this
#      one moved on 2026-08-04, and whoever moves it decides what runs with our
#      token. Sonar rule S7637 caught this on 2026-08-05. Bump the pin
#      deliberately (dependabot's github-actions ecosystem proposes it), never
#      by widening it back to a tag.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review
    # `release/*` est ecartee, et ce n'est pas un confort. La PR de release est
    # ouverte par `github-actions[bot]`, et l'action REFUSE un run initie par un
    # robot : « Workflow initiated by non-human actor: github-actions (type:
    # Bot) » (mesure du 2026-08-22, run 32537967966). Le check `review` etait
    # donc ROUGE sur toute release, sans avoir lu une ligne du diff - un rouge
    # qui ne parle pas du code est pire qu'un check absent, parce qu'il apprend
    # a passer outre. La reponse n'est PAS d'ouvrir `allowed_bots` : ce fichier
    # nourrit un agent porteur d'un jeton avec du texte que l'auteur de la PR
    # controle, et l'invariant 1 ci-dessus tient a ce que la porte reste
    # etroite. Une PR de release ne porte qu'une entree de CHANGELOG ; le code,
    # lui, a ete revu sur son chemin vers `develop`.
    # The secret check is this job's first step rather than a job of its own:
    # a job billed a full minute to compute a boolean is a minute wasted.
    if: github.event.pull_request.draft == false && !startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write # the action exchanges a GitHub OIDC token for its app token
    steps:
      - id: flags
        run: echo "can_review=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.flags.outputs.can_review == 'true'
        with:
          fetch-depth: 0

      - name: Claude review
        if: steps.flags.outputs.can_review == 'true'
        uses: anthropics/claude-code-action@1f291e1cfe0f5fc21db2aef19af844591600ade7 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            Review this pull request as a strict quality gate for AI-generated
            code. The linters already ran; do not repeat them. Hunt only for:
            - dead or unreachable code, features nothing uses
            - duplication of intent: reimplementing something that already
              exists elsewhere in the repo
            - speculative abstraction, layers or options nothing needs
            - drift from the existing architecture and naming conventions
            - tests that assert nothing or mirror the implementation
            - silently swallowed errors
            - new dependencies without a stated justification
            Report only real findings with file:line references, most severe
            first. Be terse. If the change is clean, say so in one line.
