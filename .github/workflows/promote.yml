name: promote

# La release en UN dispatch : c'est le bouton « Mettre en prod » du cockpit.
#
# Il coupe `release/vX.Y.Z` depuis `develop`, date l'entree du CHANGELOG, ouvre
# la PR vers `main`, joue la gate du depot SUR la branche de release, fusionne
# la PR une fois cette gate verte, puis reporte `main` dans `develop`. Les deux
# PR ont une branche JETABLE pour source : une PR dont la source est `develop`
# supprime `develop` au merge (`delete_branch_on_merge`), et l'ecosysteme l'a
# deja paye deux fois - voir `docs/gitflow.md`.
#
# PIEGE STRUCTURANT : la PR de release est ouverte par `github-actions[bot]`, et
# tout ce qui suit en decoule. Les deux moities de ce fichier le paient, et pas
# au meme endroit.
#
# Cote PR : les runs `pull_request` de cette PR naissent en `action_required` et
# ne publient AUCUN check run tant que personne ne les approuve. La cause est
# `fork-pr-contributor-approval = first_time_contributors` sur ce depot : le
# robot y compte comme un contributeur inconnu. Or `main` exige les contextes
# `Code Quality` et `Bundle Size`, `enforce_admins` compris. Deux releases sont
# mortes la-dessus sur `the base branch policy prohibits the merge` - runs
# 32321459524 (2026-08-20) et 32537955578 (2026-08-22) - et la premiere version
# de ce fichier annoncait en plus une gate qu'elle ne jouait pas : elle dormait
# 20 s, ne trouvait aucun check, le DISAIT, et fusionnait quand meme.
#
# Une gate DISPATCHEE sur `release/vX.Y.Z` a ete essayee et ne suffit pas : ses
# check runs se posent bien sur le commit, mais la protection de branche lit le
# rollup DE LA PR, et une check suite de `workflow_dispatch` n'y figure pas
# (mesure sur la PR #162 : `Code Quality` et `Bundle Size` verts sur le SHA,
# rollup de la PR vide, `mergeStateStatus` BLOCKED). L'etape ci-dessous approuve
# donc les runs en attente, puis attend les checks DE LA PR - ceux que la
# protection lit, et ceux qu'un humain regarderait.
#
# Cote push : un merge fait par `GITHUB_TOKEN` ne declenche aucun workflow, donc
# fusionner la release ne deploie rien et la prod servirait l'ancien build sous
# une CI verte. L'avant-derniere etape rattrape ca en dispatchant `deploy.yml`
# sur `main` - `workflow_dispatch` est la seule exception documentee a cette
# regle, avec `repository_dispatch`.

on:
  workflow_dispatch:
    inputs:
      niveau:
        description: Quel chiffre monte, quand la version n'est pas donnee.
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]
      version:
        description: Version exacte, sans le v (ex 0.12.3). Prime sur le niveau.
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write # dispatcher deploy.yml sur la release, puis sur main

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    name: develop -> main
    runs-on: ubuntu-latest
    # L'attente de la gate est desormais reelle, la ou elle rendait la main en
    # 20 s : `deploy.yml` construit le front et le back, et 30 min ne laissaient
    # plus de marge pour le merge, le back-merge et le dispatch final.
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: develop

      # Le node du depot, pas celui du runner : c'est lui qui installera le
      # formateur plus bas.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Refuse an empty release
        run: |
          git fetch origin main develop --quiet
          count=$(git rev-list --count origin/main..origin/develop)
          echo "commits ahead of main: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::develop carries nothing that main does not already have." >&2
            exit 1
          fi

      - name: Refuse a develop that is behind main
        # `main` est protegee avec `strict: true` : une branche qui n'est pas a
        # jour avec elle ne peut PAS etre fusionnee, quelle que soit la couleur
        # de la gate. Une release coupee sur une `develop` en retard part donc
        # droit dans un refus de politique de branche, apres avoir consomme le
        # numero de version et laisse une branche derriere elle. Le back-merge
        # se fait AVANT, pas apres l'echec.
        run: |
          behind=$(git rev-list --count origin/develop..origin/main)
          echo "commits on main that develop lacks: $behind"
          if [ "$behind" -ne 0 ]; then
            echo "::error::develop is $behind commit(s) behind main. Back-merge main into develop first." >&2
            exit 1
          fi

      - name: Resolve the version
        id: v
        # Les entrees passent par l'ENVIRONNEMENT et jamais par une
        # interpolation dans le script : `${{ inputs.version }}` ecrit tel quel
        # dans un `run:` laisse qui declenche le workflow y injecter du shell.
        env:
          ASKED: ${{ inputs.version }}
          NIVEAU: ${{ inputs.niveau }}
        run: |
          asked="$ASKED"
          if [ -n "$asked" ]; then
            echo "version=$asked" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Le dernier numero publie est le premier `## [x.y.z]` du CHANGELOG.
          last=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md 2>/dev/null | tr -d '#[] ' || true)
          [ -z "$last" ] && last="0.0.0"
          major=${last%%.*}
          rest=${last#*.}
          minor=${rest%%.*}
          patch=${rest##*.}
          case "$NIVEAU" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *)     patch=$((patch + 1)) ;;
          esac
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - name: Cut the release branch
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          git config user.name 'Florian Mousseau'
          git config user.email 'florian.mousseau@gmail.com'
          git checkout -B "release/v$VERSION" origin/develop

      - name: Write the changelog entry
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          version="$VERSION"
          today=$(date -u +%Y-%m-%d)
          [ -f CHANGELOG.md ] || printf '# Changelog\n\n' > CHANGELOG.md

          # Ce que la version embarque, dans les mots des commits de develop.
          # Un `## [Unreleased]` deja redige gagne : il est ecrit pour un
          # lecteur, la liste ci-dessous ne l'est que pour un mainteneur.
          git log --no-merges --format='%s' origin/main..origin/develop \
            | grep -vE '^(chore|ci|build|test|style)(\(|:)' \
            | sed 's/^/- /' > generated-notes.md || true
          [ -s generated-notes.md ] || echo "- Corrections internes." > generated-notes.md

          if grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            awk -v v="$version" -v d="$today" \
              '{ sub(/^## \[Unreleased\].*$/, "## [" v "] - " d); print }' \
              CHANGELOG.md > CHANGELOG.new
          else
            # Ancre sur la premiere section VERSIONNEE : une entete non datee
            # posee a la main garde ainsi sa place au-dessus.
            awk -v v="$version" -v d="$today" -v f=generated-notes.md '
              BEGIN { done = 0 }
              /^## \[[0-9]/ && !done {
                print "## [" v "] - " d
                print ""
                while ((getline line < f) > 0) print line
                print ""
                done = 1
              }
              { print }
              END {
                if (!done) {
                  print ""
                  print "## [" v "] - " d
                  print ""
                  while ((getline line < f) > 0) print line
                }
              }
            ' CHANGELOG.md > CHANGELOG.new
          fi
          mv CHANGELOG.new CHANGELOG.md

      - name: Make the changelog pass the repository's own gate
        # Mesure du 2026-08-17, premier passage reel : la PR de release part
        # ROUGE sur un fichier que ce workflow vient d'ecrire lui-meme. Deux
        # lignes vides la ou prettier en veut une, parce que l'entete fraiche
        # se termine deja par un saut. Un workflow qui casse la gate qu'il doit
        # ensuite attendre ne finit jamais.
        #
        # La normalisation d'abord, parce qu'elle est deterministe et gratuite ;
        # prettier ensuite, seulement s'il est dans les dependances, et A LA
        # VERSION DU DEPOT - deux majeurs de prettier ne formatent pas pareil,
        # et on reglerait un rouge en en posant un autre. Il ne touche QUE le
        # CHANGELOG : un `npm run format` reecrirait tout le depot et mettrait
        # des fichiers etrangers dans le commit de release.
        run: |
          node -e "const f='CHANGELOG.md',fs=require('fs');fs.writeFileSync(f,fs.readFileSync(f,'utf8').replace(/\n{3,}/g,'\n\n').replace(/\s*$/,'\n'))"

          # Le formateur du depot, installe AVEC ses dependances : une config
          # prettier peut declarer des plugins (`prettier-plugin-astro`), et un
          # `npx prettier@<version>` isole meurt sur `Cannot find package` -
          # mesure sur rendita au premier essai.
          #
          # Et l'echec du formateur n'arrete PAS la release : c'est la gate
          # dispatchee plus bas qui juge, et elle juge mieux. Un outil de confort qui bloque
          # la livraison est un outil qui coute plus qu'il ne rend.
          # `--ignore-scripts` a l'installation, et le binaire du depot appele
          # DIRECTEMENT plutot que par `npx` : on ne veut que resoudre des
          # plugins, pas executer les scripts de cycle de vie de tout l'arbre de
          # dependances ni laisser un outil s'installer a la volee.
          if [ -f package-lock.json ] && node -e "const p=require('./package.json');process.exit(((p.devDependencies||{}).prettier||(p.dependencies||{}).prettier)?0:1)" 2>/dev/null; then
            npm ci --ignore-scripts --prefer-offline --no-audit --no-fund >/dev/null 2>&1 &&
              ./node_modules/.bin/prettier --write CHANGELOG.md ||
              echo "::warning::prettier n a pas pu tourner ; la gate de la release tranchera"
          else
            echo "pas de prettier dans ce depot : la normalisation suffit"
          fi

      - name: Open the release pull request
        id: pr
        # `gh pr create` echoue depuis un workflow tant que « Allow GitHub
        # Actions to create and approve pull requests » est decoche - au niveau
        # du DEPOT et, pour un depot d'organisation, au niveau de l'ORG, qui
        # gagne. Aucun `permissions:` ne contourne ce reglage, et le message
        # (`createPullRequest`) ne dit pas ou aller le cocher.
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          version="$VERSION"
          branch="release/v$version"
          git add CHANGELOG.md
          git commit -m "chore(release): v$version"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "release: v$version" --body-file generated-notes.md
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Wait for the gate
        # LA gate de la release, et elle ne se negocie pas. Les runs
        # `pull_request` de cette PR existent mais dorment en `action_required`
        # (voir l'entete) : on les LIBERE, puis on attend leur verdict. Sans
        # l'approbation, aucun check run n'est publie, `gh pr checks` ne trouve
        # rien, et la protection de `main` refuse ensuite le merge.
        #
        # Une absence de check n'est PAS un feu vert : elle sort en 1 avec sa
        # raison, la ou la premiere version de cette etape la degradait en
        # avertissement et fusionnait quand meme.
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          branch="$BRANCH"

          # Les runs mettent quelques secondes a apparaitre apres l'ouverture
          # de la PR ; sans cette attente il n'y a rien a approuver.
          approuves=0
          for _ in $(seq 1 12); do
            sleep 5
            for id in $(gh run list --branch "$branch" --event pull_request --limit 20 \
              --json databaseId,status --jq '.[] | select(.status == "action_required") | .databaseId'); do
              if gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" >/dev/null 2>&1; then
                approuves=$((approuves + 1))
              fi
            done
            if [ "$approuves" -gt 0 ]; then break; fi
          done
          echo "runs liberes de l attente d approbation : $approuves"

          if ! gh pr checks "$branch" >/dev/null 2>&1; then
            echo "::error::Aucun check sur la PR de release. Si des runs restent en action_required, les approuver puis relancer promote." >&2
            exit 1
          fi

          # `--fail-fast` : un check rouge sort en 1, et le job s'arrete ICI,
          # avant le merge. C'est tout l'objet de cette etape - `main` reste
          # alors intacte et la prod continue de servir la version precedente.
          gh pr checks "$branch" --watch --fail-fast --interval 15
          echo "gate=verte" >> "$GITHUB_ENV"

      - name: Merge the release
        # Ce qui autorise ce merge est le verdict de l'etape precedente, pris
        # sur les checks DE LA PR - ceux que la protection de `main` lit.
        env:
          VERSION: ${{ steps.v.outputs.version }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          version="$VERSION"
          gh pr merge "$BRANCH" --merge --subject "release: v$version"

      - name: Back-merge main into develop
        env:
          VERSION: ${{ steps.v.outputs.version }}
        # Jamais une PR dont la source est `main` : elle serait supprimee au
        # merge. La branche jetable porte le report.
        run: |
          version="$VERSION"
          branch="backmerge/v$version"
          git fetch origin main develop --quiet
          if [ -z "$(git rev-list origin/develop..origin/main)" ]; then
            echo "develop already carries main; nothing to back-merge."
            exit 0
          fi
          git checkout -B "$branch" origin/main
          git push origin "$branch"
          gh pr create --base develop --head "$branch" \
            --title "chore: back-merge main after v$version" \
            --body "Report of the release commit into develop."
          gh pr merge "$branch" --merge

      - name: Deploy the release
        # Le merge ci-dessus est fait par GITHUB_TOKEN : il ne declenche rien.
        # Ce dispatch est le SEUL chemin vers la prod, et il n'est pas optionnel.
        run: gh workflow run deploy.yml --ref main

      - name: Say what went out
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          {
            echo "### v$VERSION en prod"
            echo ""
            echo "Gate : ${gate:-inconnue}"
            echo ""
            cat generated-notes.md
          } >> "$GITHUB_STEP_SUMMARY"
