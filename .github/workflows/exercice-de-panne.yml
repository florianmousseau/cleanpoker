name: Outage drill

# THE OUTAGE DRILL, ON PRODUCTION (D-128).
#
# Each source the probe reads is cut in turn by `POST /health/exercice`, for
# that single response: no visitor sees the cut, nothing is written. The site
# judges each cut itself (`exercice.verdicts`, `frontend/src/lib/exercice.ts`):
# seen when the probe reaches the level the cut calls for on the finding
# its source feeds, says a reason the intact probe does not, and breaks
# nothing it did not declare. The job fails on any cut the probe does not see. The baseline
# call (nothing cut) lists the cuts and must carry none. GitHub's OIDC token
# for `main` authenticates the job: no secret. Once a month, and by hand after
# any change to the probe (dispatch it on `main`: the token of any other
# branch is refused).

on:
  schedule:
    - cron: '53 6 1 * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: outage-drill
  cancel-in-progress: false

jobs:
  drill:
    # Hosted: a public repository never gets a self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cut each source, one at a time
        run: |
          set -u
          exercer() {
            jeton=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://cleanpoker.dev" | jq -r '.value')
            curl -sS --max-time 60 -X POST -H "Authorization: Bearer $jeton" \
              -H "content-type: application/json" -d "$1" \
              https://cleanpoker.dev/health/exercice
          }
          rate=0
          temoin=$(exercer '{"couper":[]}')
          if echo "$temoin" | jq -e '.exercice.coupe == [] and ((.echecs_des_sondes | map(contains("(exercice)")) | any) | not)' > /dev/null; then
            echo "baseline: $(echo "$temoin" | jq -r '.alerte'), nothing cut" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "baseline unreadable or cut: $temoin" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          while IFS= read -r nom; do
            lu=$(exercer "$(jq -cn --argjson n "$nom" '{couper: [$n]}')")
            if echo "$lu" | jq -e --argjson s "$nom" '
                .alerte != "ok"
                and .exercice.coupe == [$s]
                and .exercice.verdicts[$s].vu == true
                and (.echecs_des_sondes | length) > 0' > /dev/null; then
              echo "$nom cut: $(echo "$lu" | jq -r --argjson s "$nom" '"\(.alerte), \(.exercice.verdicts[$s].raison)"')" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "$nom cut: the probe did NOT see it: $lu" | tee -a "$GITHUB_STEP_SUMMARY"; rate=1
            fi
          done < <(echo "$temoin" | jq -c '.exercice.connues[]')
          exit $rate
