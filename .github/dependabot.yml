# target-branch is not optional here: dependabot defaults to the repository's
# default branch, which is main, while every change is integrated through
# develop. Without it the bumps land on the release branch and skip the one
# they were meant to be tested on.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    groups:
      # One lockfile, so one pull request: separate ones only force a rebase
      # and a fresh CI run on every sibling.
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]
    # SvelteKit 3 stays out (decision of 2026-10-25, D-232): it fixes only low
    # advisories and adds 3.6 to 4.5 kB of JS for every reader. Reopened on a
    # high or critical advisory fixed only in Kit 3, or when Kit 2 stops
    # receiving security fixes.
    ignore:
      - dependency-name: "@sveltejs/kit"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@sveltejs/adapter-*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gomod
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    groups:
      backend:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    labels: [dependencies, backend]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    groups:
      # codeql-action/init, autobuild and analyze must always move together:
      # a mixed pair fails the analysis with "unable to automatically build
      # your code". Grouping every action keeps that guarantee.
      actions:
        patterns: ["*"]
